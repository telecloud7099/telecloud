name: telecloud

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: telecloud-nginx
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
    networks:
      - edge
    depends_on:
      telecloud-app:
        condition: service_healthy
    # Phase 14b (2026-07-24): master process stays root (confirmed via live
    # audit -- needs to bind port 80, a privileged port, and setuid/setgid to
    # fork the unprivileged `nginx` worker processes), but everything else is
    # dropped. This is nginx's own documented minimal set for exactly this
    # pattern, not a guess -- verified empirically after applying. CHOWN is
    # included even though the audit showed /var/cache/nginx's temp dirs
    # already correctly owned at image-build time (so it may prove unneeded
    # in practice) -- kept for now since removing it isn't proven safe either,
    # revisit if a future audit wants to narrow further.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
      - CHOWN
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /run

  telecloud-app:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: telecloud-app
    restart: unless-stopped
    init: true
    logging: *default-logging
    stop_grace_period: 30s
    env_file:
      - .env.app
    networks:
      - edge
      - data
    volumes:
      - ${TELECLOUD_DATA_DIR:-/opt/telecloud/data}/uploads:/app/uploads
      - ${TELECLOUD_DATA_DIR:-/opt/telecloud/data}/thumbs:/app/thumbs
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Phase 14b (2026-07-24): already ran with zero effective Linux capabilities
    # before this (confirmed via /proc/1/status -- non-root appuser never held
    # any of Docker's default bounding set), so cap_drop is defense-in-depth
    # (shrinks the bounding set too) rather than a functional change. uploads/
    # thumbs are bind-mounted outside the rootfs already; /tmp is the only
    # other writable path given a tmpfs, as safe insurance -- confirmed empty
    # under normal operation but no code path proven to never need it.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  # Defined now so the compose architecture doesn't change shape later, but unused
  # until Phase 5B: telecloud-app's DATABASE_URL still points at Neon (see .env.app),
  # so this container starts and stays healthy but idle until the cutover.
  # Pinned to 18-alpine (Phase 13, 2026-07-23) specifically to match Neon's actual
  # server version (verified via `SELECT version()` against the real Neon endpoint,
  # not assumed) -- pg_dump/restore across major versions is the riskier direction
  # this project explicitly wants to avoid rather than discover mid-restore.
  postgres:
    # Digest-pinned (Phase 14c, 2026-07-24) -- supply-chain integrity, not a
    # vulnerability fix: locks out a surprise/malicious tag repush, doesn't
    # change CVE exposure. Confirmed matching the digest already resolved on
    # the VM before pinning.
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    container_name: telecloud-postgres
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env.db
    networks:
      - data
    # Mounted at /var/lib/postgresql (not .../data) -- a breaking change in the official
    # image starting at v18: it now expects the volume one level up and creates its own
    # version-specific subdirectory inside, to support `pg_upgrade --link` cleanly without
    # mount-point boundary issues (docker-library/postgres PR #1259 / issue #37). Confirmed
    # by direct failure on this VM (Phase 13, 2026-07-23) -- the old .../data mount point
    # made the v18 entrypoint refuse to start, citing exactly this change.
    volumes:
      - ${TELECLOUD_DATA_DIR:-/opt/telecloud/data}/postgres:/var/lib/postgresql
    healthcheck:
      # $$ (escaped from Compose's own substitution) so POSTGRES_USER is read from the
      # container's own runtime env (via .env.db above) at healthcheck-execution time,
      # instead of needing to also exist in the project-root .env used for compose-file
      # substitution (see .env.example) — keeps the secret in exactly one file.
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\""]
      interval: 10s
      timeout: 5s
      retries: 5
    # Phase 14b (2026-07-24): PID 1 already confirmed running as uid 70
    # (postgres, non-root) by the time it's serving -- the official
    # entrypoint starts as root briefly to fix ownership/permissions before
    # gosu-ing to postgres, hence the CHOWN/DAC_OVERRIDE/FOWNER/SETUID/SETGID
    # set (covers that root phase, not the long-running server). The data
    # directory itself is a bind mount (/var/lib/postgresql), unaffected by
    # read_only regardless -- tmpfs only needed for the socket dir and /tmp.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/run/postgresql
      - /tmp

networks:
  edge:
    driver: bridge
  data:
    driver: bridge
