# TeleCloud reverse proxy — Phase 4 (VirtualBox dev/test stage, HTTP only).
# nginx is a pure reverse proxy here (Option A): FastAPI serves both the API and the
# built SPA, so there's no static-file location to maintain here — everything proxies
# straight through to telecloud-app.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Hides the nginx version from the Server header and default error pages.
    server_tokens off;

    # Phase 12 (2026-07-23): added request_time/upstream_* timing fields directly to the
    # plain-text access log for manual/grep-based review. Loki/Grafana remains a possible
    # future enhancement (not adopted now — see docs/OPERATIONS_RUNBOOK.md) rather than a
    # prerequisite for having timing data at all.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for" '
                     'rt=$request_time uct=$upstream_connect_time '
                     'uht=$upstream_header_time urt=$upstream_response_time';
    access_log  /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # Small default — the uploads location below overrides this explicitly for large
    # request bodies. Keeping the global default small means anything NOT matched by
    # that location (plain API calls) stays bounded.
    client_max_body_size 1m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;
    gzip_min_length 256;   # not worth the CPU below this — compression overhead exceeds the savings
    gzip_comp_level 5;     # balanced ratio vs CPU; kept modest since the eventual home-server target (i3-2120) is weak
    gzip_vary on;          # adds Vary: Accept-Encoding so intermediate caches don't serve gzip to clients that can't decode it

    # Docker's embedded DNS (127.0.0.11 on any user-defined bridge network, which edge/
    # data both are) re-resolves telecloud-app on every cache expiry instead of nginx
    # caching one IP for its whole lifetime — see note above on why a static upstream{}
    # block would quietly break after a backend container restart.
    resolver 127.0.0.11 valid=10s;

    # Phase 7 — per-endpoint rate limiting (SECURITY_ARCHITECTURE.md §5 domain 2).
    # Deliberately NOT one global zone: auth, uploads, and downloads have very
    # different legitimate request patterns (a few OTP attempts vs. frequent
    # upload-progress polling vs. a full thumbnail-grid page load), so a single
    # shared budget would either be too loose to matter for auth or too tight for
    # uploads/downloads. All three use `nodelay` — reject over-limit requests
    # immediately (429) rather than queuing them — for predictable behavior that's
    # easy to test and to read back out of the logs.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=uploads:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=downloads:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=15r/s;
    # 429 (not the nginx default 503) so a rate-limit rejection is unambiguous in
    # logs and in the client — a 503 could be mistaken for the backend being down.
    limit_req_status 429;
    # Explicit rather than relying on the default: makes every rate-limit event show
    # up in error_log (already `warn` level above) with the zone name, client IP, and
    # request line — e.g. "limiting requests, excess: ... by zone "auth", client: ...".
    limit_req_log_level warn;

    server {
        listen 80;
        server_name _;

        set $backend telecloud-app:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # TeleCloud doesn't use any of these browser features anywhere — blocks a
        # compromised/injected script from invoking them even if it got past CSP.
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;

        # Prevents other origins from directly embedding/reading this origin's
        # responses (e.g. hotlinking a user's private /file/ or /thumbnail/ URL from
        # another site's <img>). Safe to set globally: it only restricts CROSS-origin
        # fetches — the SPA's own same-origin loading of its JS/CSS is unaffected.
        add_header Cross-Origin-Resource-Policy "same-origin" always;

        # Content-Security-Policy — Report-Only for now (SECURITY_ARCHITECTURE.md §7:
        # validate before enforcing). Browsers apply no restriction yet, only report
        # violations to /csp-report and to the DevTools console. Switch the header
        # name to plain `Content-Security-Policy` (dropping `-Report-Only`) once a full
        # pass of the functional test matrix shows no unexpected violations.
        #
        # script-src 'self' (no unsafe-inline/eval) is the one that actually matters as
        # defense-in-depth for SECURITY_NOTES.md issue #1 (stored XSS): it blocks the
        # browser from executing inline event-handler attributes like `onerror=`, which
        # is exactly how that issue's known PoC (`<img src=x onerror=...>` via
        # innerHTML) executes. This does NOT replace the actual fix (innerHTML ->
        # textContent) — issue #1 stays open regardless of this header.
        #
        # style-src allows 'unsafe-inline' pragmatically: the frontend has no CSS-in-JS
        # library, but `sonner` (toast UI) may inject a <style> tag at runtime, and
        # Google Fonts' stylesheet is loaded via a normal <link>, not inline — a strict
        # style-src risks an unnecessary false break for low security benefit here.
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; report-uri /csp-report;" always;

        # Proxied health check — verifies the whole nginx->app path from outside the VM,
        # distinct from Docker's own internal healthcheck that curls telecloud-app directly.
        location /health {
            access_log off;
            proxy_pass http://$backend/health;
        }

        # CSP violation reports land here during the Report-Only validation window.
        # Coarse signal only (confirms a report arrived, with client/timestamp) — full
        # JSON report-body capture would need $request_body logging or a real collector,
        # not worth the added complexity for a personal-project validation pass. Rate
        # limited on the same `api` budget so the endpoint itself can't be abused to
        # flood the log.
        #
        # Phase 14b (2026-07-24): logs to /dev/stdout, not a dedicated file — this was
        # the one non-symlinked writable file nginx created, blocking a clean read_only
        # rootfs. Matches the stdout-only logging design already used everywhere else
        # (Phase 4) rather than introducing a second convention just for this endpoint.
        location = /csp-report {
            limit_req zone=api burst=10 nodelay;
            access_log /dev/stdout main;
            return 204;
        }

        # Login/OTP endpoints — the account-auth-sensitive routes most worth throttling
        # against brute-force/enumeration. Kept in its own zone, separate from uploads
        # and downloads, per the "no single global rate" refinement: a legitimate user
        # retrying a mistyped OTP a couple of times should never be affected by this,
        # but a scripted loop against /send_code or /verify_code hits the 429 fast.
        location ~ ^/(check-phone|send_code|verify_code|verify_password)$ {
            limit_req zone=auth burst=3 nodelay;
            proxy_pass http://$backend;
        }

        # Single-shot /upload and the chunked /uploads session routes (create, list,
        # PUT .../parts/{n}, complete, abort) — large, slow request BODIES.
        # proxy_request_buffering off streams the body straight to the backend instead of
        # nginx buffering a multi-GB PUT to disk first. Timeouts are generous *idle*
        # timeouts (reset on activity, not a total-duration cap) so a real ~1.25MB/s
        # upload of a 1.9GB part (~25 min, see project notes) isn't cut off by a brief
        # transient stall — only a genuine dead connection times out.
        location ~ ^/(upload|uploads)(/|$) {
            # Generous on purpose: covers the resumable-upload widget's progress
            # polling (every few seconds per active upload) plus the occasional
            # session-create/PUT-chunk/complete calls, without meaningfully limiting
            # a real user — this zone exists to blunt scripted abuse, not slow down
            # normal upload usage.
            limit_req zone=uploads burst=20 nodelay;
            client_max_body_size 4096m;
            proxy_request_buffering off;

            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            client_body_timeout 300s;

            proxy_pass http://$backend;
        }

        # File/thumbnail downloads — large, slow response BODIES; /file/ also needs Range
        # (206 Partial Content) to pass through untouched for video seeking.
        # proxy_buffering off forwards bytes to the client as they arrive from the backend
        # instead of nginx buffering the whole file first, which would add serious latency
        # and memory pressure on multi-GB files and defeat seeking entirely.
        location ~ ^/(file|thumbnail)/ {
            # Generous burst: a folder/gallery view can fire dozens of thumbnail
            # requests near-simultaneously on a single page load — that's normal
            # usage, not abuse.
            limit_req zone=downloads burst=50 nodelay;
            proxy_buffering off;
            proxy_read_timeout 300s;
            send_timeout 300s;

            proxy_pass http://$backend;
        }

        # Everything else — general API routes and the SPA itself, including its JS/CSS
        # bundles. Default proxy_buffers are sized for small API responses (a few KB) and
        # spill anything bigger to a disk temp file (/var/cache/nginx/proxy_temp/) — seen
        # in practice on this bundle's ~330KB main JS chunk. Sized here to comfortably hold
        # a typical bundle in memory instead of round-tripping through disk on every load.
        location / {
            # Covers the SPA itself plus general API routes (files/folders/me/etc.) not
            # matched by the more specific zones above. Comfortable for a normal page
            # load's handful of parallel requests plus routine navigation.
            limit_req zone=api burst=30 nodelay;
            proxy_buffer_size 64k;
            proxy_buffers 16 64k;

            proxy_pass http://$backend;
        }
    }

    # ---- HTTPS server (placeholder — home-server deployment phase, Phase 7) ----
    # Not active yet; the locked Phase 7 decision keeps this VM HTTP-only. Two paths when
    # this moves to the home server:
    #   (a) Cloudflare Tunnel — no certs or listen block needed here at all; cloudflared
    #       terminates TLS at the edge and forwards plain HTTP to the :80 server above.
    #   (b) Let's Encrypt — uncomment the block below, mount real certs (e.g. via certbot)
    #       at the paths shown, and add `return 301 https://$host$request_uri;` inside the
    #       :80 server block above to force HTTPS.
    #
    # server {
    #     listen 443 ssl;
    #     server_name your-domain.example;
    #
    #     ssl_certificate     /etc/letsencrypt/live/your-domain.example/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/your-domain.example/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #
    #     add_header Strict-Transport-Security "max-age=63072000" always;
    #
    #     # ... same set $backend / proxy_set_header / location blocks as the :80 server ...
    # }
}
